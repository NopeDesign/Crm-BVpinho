<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando CRM...</title>
    <style>
        /* =========================================
           RESET BÁSICO
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* =========================================
           FUNDO (Gradiente Azul Petróleo BV Pinho)
           ========================================= */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #3a6e85 0%, #1e3b48 100%);
            overflow: hidden;
        }

        /* Container principal */
        .loading-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* =========================================
           LOGO E ANIMAÇÃO DE FLUTUAÇÃO PREMIUM
           ========================================= */
        .logo {
            width: 100%;
            max-width: 460px;
            margin-bottom: 50px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4));
            animation: floatPulse 3.5s infinite ease-in-out;
        }

        @keyframes floatPulse {
            0% { transform: translateY(0px) scale(0.98); opacity: 0.85; }
            50% { transform: translateY(-12px) scale(1.02); opacity: 1; }
            100% { transform: translateY(0px) scale(0.98); opacity: 0.85; }
        }

        /* =========================================
           BARRA DE PROGRESSO (Efeito Vidro/Glow Dourado)
           ========================================= */
        .progress-wrapper {
            width: 320px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(135deg, #bb8e44, #9c7536); /* Dourado BV Pinho */
            box-shadow: 0 0 12px rgba(187, 142, 68, 0.6); /* Brilho neon dourado */
            border-radius: 20px;
            animation: load 3s cubic-bezier(0.4, 0, 0.2, 1) forwards; 
        }

        @keyframes load {
            0% { width: 0%; }
            30% { width: 45%; }
            70% { width: 85%; }
            100% { width: 100%; }
        }

        /* =========================================
           TEXTO DE STATUS
           ========================================= */
        .loading-text {
            color: rgba(255, 255, 255, 0.7); 
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }
    </style>
</head>
<body>

    <div class="loading-container" id="loading-screen">
        <!-- Logo com o caminho correto -->
        <img src="/src/logo.svg" alt="Logo do CRM" class="logo">

        <div class="progress-wrapper">
            <div class="progress-bar"></div>
        </div>

        <p class="loading-text" id="status-text">Autenticando...</p>
    </div>

    <script>
        const statusText = document.getElementById('status-text');

        // Em 800 milissegundos muda a mensagem de sucesso
        setTimeout(() => {
            statusText.innerText = "ACESSO LIBERADO ✔️";
            statusText.style.color = "#4ade80"; // Verde neon moderno
            statusText.style.letterSpacing = "3px";
            statusText.style.textShadow = "0 0 10px rgba(74, 222, 128, 0.4)";
        }, 800); 

        // Após a barra encher, redireciona para o Painel
        setTimeout(() => {
            window.location.href = '/painel/index.html'; 
        }, 3000);
    </script>

</body>
</html>
